<!DOCTYPE html>
<html>
  <head>
    <title>Buy Cool New Product</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
        padding: 20px;
        background-color: #f9f9f9;
      }
      h3 {
        color: #333;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }
      form {
        margin-top: 20px;
      }
      button {
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }
      button:hover {
        background-color: #0056b3;
      }
      a {
        display: inline-block;
        margin-top: 10px;
        color: #d9534f;
        text-decoration: none;
        font-weight: bold;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Payment Details</h2>
      <h3>Name: {{ data.customer_name }}</h3>
      <h3>Email: {{ data.customer_email }}</h3>
      <h3>Age: {{ data.customer_age }}</h3>
      <h3>Gender: {{ data.gender }}</h3>
      <h3>Seat: {{ data.seats }}</h3>

      <form action="{% url 'checkout_session' data.id %}" method="POST">
        {% csrf_token %}
        <button type="submit" name="ammount" value="{{ pay_ammount }}">
          Pay ₹{{ pay_ammount }}
        </button>
      </form>

      {% comment %} <a href="{% url 'cencle_session' data.id %}">Cancel</a> {% endcomment %}
      <a href="{% url 'cencle_session' data.id %}" onclick="return confirm('Are you sure you want to cancle Your Ticket?');" class="btn btn-danger btn-sm">Cancle</a>
    </div>
  </body>
</html>
