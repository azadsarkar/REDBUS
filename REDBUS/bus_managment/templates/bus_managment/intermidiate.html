{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">Add Intermediate Route</h5>
                </div>
                <div class="card-body">
                    <!-- Form Section -->
                    <form action="" method="post">
                        {% csrf_token %}
                        
                        <!-- Bus Route Field -->
                        <div class="form-group">
                            <label for="bus_route">Bus Route:</label>
                            {{ form.bus_route }}
                        </div>
                        
                        <!-- Stop Name Field -->
                        <div class="form-group">
                            <label for="stop_name">Stop Name:</label>
                            {{ form.stop_name }}
                        </div>

                        <!-- Arrival Time Field -->
                        <div class="form-group">
                            <label for="stop_name">Arrival Time:</label>
                            {{ form.intermidiate_stop_time }}
                        </div>

                        <!-- Intermediate Stop ID Field -->
                        <div class="form-group">
                            <label for="inter_stop_id">Intermediate Stop ID:</label>
                            {{ form.inter_stop_id }}
                        </div>

                        <!-- Submit Button -->
                        <div class="text-center mt-4">
                            <input type="submit" value="Add Intermediate Route" class="btn btn-success">
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <a href="{% url 'dashboard' %}" class="btn btn-link">Back to Home</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
