{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">Update Bus Schedule</h5>
                </div>
                <div class="card-body">
                    <!-- Update Form -->
                    <form action="" method="post">
                        {% csrf_token %}
                        
                        <!-- Render form fields -->
                        <div class="form-group">
                            {{ form.as_p }}
                        </div>

                        <!-- Submit Button -->
                        <div class="text-center mt-4">
                            <input type="submit" value="Save" class="btn btn-success">
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <a href="{% url 'bus_schedule_details' %}" class="btn btn-link">Back to Bus Schedule Details</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
