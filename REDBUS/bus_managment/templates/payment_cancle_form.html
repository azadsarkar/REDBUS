{% extends 'home.html' %}

{% block extra_css %}
<style>
    /* Center the form on the page */
    .container {
        max-width: 600px;
        margin-top: 50px;
        margin-left: auto;
        margin-right: auto;
    }

    /* Form styling */
    .form-group {
        margin-bottom: 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .form-group label {
        width: 180px;
        font-weight: bold;
    }

    .form-control {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }

    /* Button styling */
    .btn-primary {
        padding: 10px 20px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
    }

    .btn-primary:hover {
        background-color: #0056b3;
    }

    /* Centering the heading */
    h1 {
        text-align: center;
        font-size: 24px;
        color: #333;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .form-group {
            flex-direction: column;
            align-items: flex-start;
        }

        .form-group label {
            width: 100%;
            margin-bottom: 5px;
        }

        .form-control {
            width: 100%;
        }

        h1 {
            font-size: 20px;
        }
    }
</style>
{% endblock extra_css %}

{% block search %}
<div class="container" style="margin-top: 80px;">
  <h1>Cancellation Form</h1>
</div>
{% endblock search %}

{% block BusData %}
<div class="container">
    <form action="" method="post">
        {% csrf_token %}
        
        <!-- Payment Amount -->
        <div class="form-group">
            <label for="payment_amount">Payment Amount:</label>
            <input type="text" id="payment_amount" name="payment_amount" value="{{ amount.total_payment }}" readonly class="form-control">
        </div>
        
        <!-- Payment Method -->
        <div class="form-group">
            <label for="payment_method">Payment Method:</label>
            <input type="text" id="payment_method" name="payment_method" class="form-control">
        </div>
        
        <!-- Payment Date -->
        <div class="form-group">
            <label for="payment_date">Payment Date:</label>
            {{ data.cancellation_date }}
            
        </div>
        
        <!-- Payment Status -->
        <div class="form-group">
            <label for="payment_status">Payment Status:</label>
            <input type="text" id="payment_status" name="payment_status" value="{{ amount.payment_status }}" readonly class="form-control">
        </div>
        
        <!-- Cancellation Reason -->
        <div class="form-group">
            <label for="cancellation_reason">Cancellation Reason:</label>
            {{ data.cancellation_reason }}
            
        </div>
        
        <!-- Submit Button -->
        <div class="form-group text-center">
            <input type="submit" value="Submit" class="btn btn-primary">
        </div>
    </form>
</div>
{% endblock BusData %}
