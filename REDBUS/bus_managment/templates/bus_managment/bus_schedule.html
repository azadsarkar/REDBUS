{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="card-title mb-0">Add Bus Schedule</h5>
                </div>
                <div class="card-body">
                    <!-- Form Section -->
                    <form action="" method="post">
                        {% csrf_token %}
                        <table class="table table-bordered">
                            <tbody>
                                {% for field in form %}
                                <tr>
                                    <th style="width: 30%;">{{ field.label_tag }}</th>
                                    <td>{{ field }}</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-success">Add Bus Schedule</button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center">
                    <a href="{% url 'dashboard' %}" class="btn btn-link">Back to Home Page</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
